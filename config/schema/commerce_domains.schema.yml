commerce_domains.provider.*:
  type: config_entity
  label: 'Domain provider'
  mapping:
    id:
      type: machine_name
      label: 'ID'
    label:
      type: required_label
      label: 'Name'
    plugin:
      type: string
      label: 'API plugin'
      nullable: true
    configuration:
      type: commerce_domains.provider_plugin.[%parent.plugin]
    credential_keys:
      type: sequence
      label: 'Keys the API credentials are read from'
      sequence:
        type: string
        label: 'Key ID, keyed by the setting it fills'
    registration_sync:
      type: boolean
      label: 'Refresh registration details daily'
    marketplace:
      type: boolean
      label: 'Domains are listed for sale here'

commerce_domains.provider_plugin.*:
  type: mapping
  label: 'Provider plugin settings'

commerce_domains.provider_plugin.afternic:
  type: mapping
  label: 'Afternic settings'
  mapping:
    api_key:
      type: string
      label: 'API key'
    api_secret:
      type: string
      label: 'API secret'
    price_factor:
      type: float
      label: 'Price factor'
    premium_price_factor:
      type: float
      label: 'Atom premium price factor'

