commerce_domains_owner.settings:
  type: config_object
  label: 'Domain portfolio settings'
  mapping:
    notify_mail:
      type: email
      label: 'Address owner notifications go to'
    notify:
      type: mapping
      label: 'Notifications sent'
      mapping:
        sold:
          type: boolean
          label: 'A domain sold on the site'
        sold_elsewhere:
          type: boolean
          label: 'A marketplace sold a domain'
        sync_failed:
          type: boolean
          label: 'A marketplace sync failed'
        expiring:
          type: boolean
          label: 'Daily digest of domains expiring soon'
        registrar_missing:
          type: boolean
          label: 'A registrar no longer holds a domain'
        offer_expired:
          type: boolean
          label: 'An offer expired'
    expiring_days:
      type: integer
      label: 'Days ahead a domain counts as expiring soon'
    off_sale_days:
      type: integer
      label: 'Days before its expiry a domain left to expire goes off sale'
    appraisals_per_day:
      type: integer
      label: 'Domains appraised a day'
    renewal_costs:
      type: sequence
      label: 'Default yearly renewal costs, for domains without their own'
      sequence:
        type: mapping
        label: 'Renewal cost of an extension'
        mapping:
          tld:
            type: string
            label: 'Extension, e.g. com or co.uk'
          number:
            type: string
            label: 'Amount'
          currency_code:
            type: string
            label: 'Currency'
    provider_renewal_costs:
      type: sequence
      label: "Registrars' own yearly renewal costs, before the defaults"
      sequence:
        type: mapping
        label: "Renewal cost of an extension at a registrar"
        mapping:
          provider:
            type: string
            label: 'Provider ID'
          tld:
            type: string
            label: 'Extension, e.g. com or co.uk'
          number:
            type: string
            label: 'Amount'
          currency_code:
            type: string
            label: 'Currency'
