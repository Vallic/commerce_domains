commerce_domains_owner.dashboard:
  path: '/admin/commerce/domains/dashboard'
  defaults:
    _controller: '\Drupal\commerce_domains_owner\Controller\DashboardController::build'
    _title: 'Domain dashboard'
  requirements:
    # Either permission: managing the portfolio means seeing it.
    _permission: 'view domain portfolio+manage domain portfolio'
  options:
    _admin_route: TRUE

commerce_domains_owner.expiring:
  path: '/admin/commerce/domains/expiring'
  defaults:
    _form: '\Drupal\commerce_domains_owner\Form\ExpiringForm'
    _title: 'Expiring soon'
  requirements:
    # Either permission: managing the portfolio means seeing it.
    _permission: 'view domain portfolio+manage domain portfolio'
  options:
    _admin_route: TRUE

commerce_domains_owner.profit:
  path: '/admin/commerce/domains/profit'
  defaults:
    _controller: '\Drupal\commerce_domains_owner\Controller\ProfitController::build'
    _title: 'Sales and profit'
  requirements:
    # Either permission: managing the portfolio means seeing it.
    _permission: 'view domain portfolio+manage domain portfolio'
  options:
    _admin_route: TRUE

commerce_domains_owner.settings:
  path: '/admin/commerce/domains/settings/portfolio'
  defaults:
    _form: '\Drupal\commerce_domains_owner\Form\SettingsForm'
    _title: 'Domain portfolio'
  requirements:
    _permission: 'manage domain portfolio'
  options:
    _admin_route: TRUE

commerce_domains_owner.sales_import:
  path: '/admin/commerce/domains/profit/import'
  defaults:
    _form: '\Drupal\commerce_domains_owner\Form\SalesImportForm'
    _title: 'Import sales'
  requirements:
    _permission: 'manage domain portfolio'
  options:
    _admin_route: TRUE

commerce_domains_owner.expenses:
  path: '/admin/commerce/domains/expenses'
  defaults:
    _controller: '\Drupal\commerce_domains_owner\Controller\ExpensesController::build'
    _title: 'Expenses'
  requirements:
    # Either permission: managing the portfolio means seeing it.
    _permission: 'view domain portfolio+manage domain portfolio'
  options:
    _admin_route: TRUE

commerce_domains_owner.renewal_import:
  path: '/admin/commerce/domains/expenses/renewals/import'
  defaults:
    _form: '\Drupal\commerce_domains_owner\Form\RenewalImportForm'
    _title: 'Import renewals'
  requirements:
    _permission: 'manage domain portfolio'
  options:
    _admin_route: TRUE

commerce_domains_owner.renewal_cost_import:
  path: '/admin/commerce/domains/renewal-costs/import'
  defaults:
    _form: '\Drupal\commerce_domains_owner\Form\RenewalCostImportForm'
    _title: 'Import renewal costs'
  requirements:
    _permission: 'manage domain portfolio'
  options:
    _admin_route: TRUE
