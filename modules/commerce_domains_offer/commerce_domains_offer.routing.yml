entity.commerce_domains_offer.collection:
  path: '/admin/commerce/domains/offers'
  defaults:
    _entity_list: 'commerce_domains_offer'
    _title: 'Domain offers'
  requirements:
    _permission: 'administer domain offers'

entity.commerce_domains_offer.canonical:
  path: '/admin/commerce/domains/offers/{commerce_domains_offer}'
  defaults:
    _form: '\Drupal\commerce_domains_offer\Form\OfferAdminForm'
    _title: 'Domain offer'
  requirements:
    _entity_access: 'commerce_domains_offer.view'
  options:
    _admin_route: TRUE
    parameters:
      commerce_domains_offer:
        type: 'entity:commerce_domains_offer'

entity.commerce_domains_offer.delete_form:
  path: '/admin/commerce/domains/offers/{commerce_domains_offer}/delete'
  defaults:
    _entity_form: 'commerce_domains_offer.delete'
    _title: 'Delete offer'
  requirements:
    _entity_access: 'commerce_domains_offer.delete'
  options:
    _admin_route: TRUE

# The buyer's page, linked from the offer emails. The token stands in for a
# login, so buyers without an account can answer a counter-offer and pay.
commerce_domains_offer.buyer:
  path: '/domain-offer/{commerce_domains_offer}/{token}'
  defaults:
    _form: '\Drupal\commerce_domains_offer\Form\OfferBuyerForm'
    _title: 'Your offer'
  requirements:
    _custom_access: '\Drupal\commerce_domains_offer\Form\OfferBuyerForm::access'
  options:
    no_cache: TRUE
    parameters:
      commerce_domains_offer:
        type: 'entity:commerce_domains_offer'

commerce_domains_offer.settings:
  path: '/admin/commerce/domains/settings/offers'
  defaults:
    _form: '\Drupal\commerce_domains_offer\Form\SettingsForm'
    _title: 'Domain offers'
  requirements:
    _permission: 'administer domain offers'
