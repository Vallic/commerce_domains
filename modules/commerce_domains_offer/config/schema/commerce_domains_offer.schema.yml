commerce_domains_offer.settings:
  type: config_object
  label: 'Domain offer settings'
  mapping:
    expire_days:
      type: integer
      label: 'Days an offer stays open without an answer'
    minimum_price:
      type: float
      label: 'Least price that takes offers, in the domain''s currency'
    premium_offers:
      type: boolean
      label: 'Take offers on Atom premium names'
    notify_mail:
      type: email
      label: 'Address told about new offers'
    require_phone:
      type: boolean
      label: 'Buyers must give a phone number'
    payment_link_provider:
      type: string
      label: 'Provider whose payment link accepted offers are paid with; empty for checkout'
    payment_link_buyer_fee:
      type: integer
      label: 'Share of the payment link fee the buyer pays, in percent'
