services:
  _defaults:
    autowire: true

  logger.channel.commerce_domains_lease:
    parent: logger.channel_base
    arguments: ['commerce_domains_lease']

  Drupal\commerce_domains_lease\LeaseCalculator: ~

  Drupal\commerce_domains_lease\LeaseManager:
    arguments:
      $logger: '@logger.channel.commerce_domains_lease'
      $lock: '@lock'

  Drupal\commerce_domains_lease\EventSubscriber\CheckoutSubscriber:
    tags:
      - { name: event_subscriber }

  # After promotions (100) and tax (50): a share of what paying in full costs.
  Drupal\commerce_domains_lease\OrderProcessor\LeaseSurchargeProcessor:
    tags:
      - { name: commerce_order.order_processor, priority: -100 }
