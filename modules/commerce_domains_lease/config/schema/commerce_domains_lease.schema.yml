commerce_domains_lease.settings:
  type: config_object
  label: 'Domain lease settings'
  mapping:
    surcharges:
      type: sequence
      label: 'What a lease adds to the price, by its term'
      sequence:
        type: mapping
        label: 'Surcharge'
        mapping:
          months:
            type: integer
            label: 'The term, in monthly payments'
          percent:
            type: integer
            label: 'Added to the order total, in percent'
    retry_days:
      type: integer
      label: 'Days between attempts to charge a missed payment'
    max_retries:
      type: integer
      label: 'Attempts after a missed payment before the lease is in default'
    notify_mail:
      type: email
      label: 'Address told about missed payments, defaults and completed leases'
    gateway_plugins:
      type: sequence
      label: 'Payment gateway plugins that charge the monthly payments to a saved card'
      sequence:
        type: string
        label: 'Payment gateway plugin ID'
    manual_gateway_plugins:
      type: sequence
      label: 'Payment gateway plugins the buyer pays each monthly payment through'
      sequence:
        type: string
        label: 'Payment gateway plugin ID'
