services:
  _defaults:
    autowire: true

  Drupal\commerce_domains_pricing\PriceRules: ~

  Drupal\commerce_domains_pricing\Rounding: ~

  Drupal\commerce_domains_pricing\CurrencyPrices:
    arguments:
      # Commerce Exchanger is optional.
      $exchanger: '@?commerce_exchanger.calculate'

  Drupal\commerce_domains_pricing\EventSubscriber\VariationSubscriber:
    tags:
      - { name: event_subscriber }
