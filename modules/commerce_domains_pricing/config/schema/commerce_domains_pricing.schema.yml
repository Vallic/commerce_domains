commerce_domains_pricing.settings:
  type: config_object
  label: 'Domain pricing settings'
  mapping:
    rules:
      type: sequence
      label: 'Pricing rules, in order: the first that matches a domain gives its price'
      sequence:
        type: commerce_domains_pricing.rule
    rounding:
      type: mapping
      label: 'Rounding of currency prices and repriced domains'
      mapping:
        whole_units:
          type: boolean
          label: 'Drop the cents before rounding'
        steps:
          type: sequence
          label: 'Rounding steps; each applies to amounts up to its limit'
          sequence:
            type: commerce_domains_pricing.rounding_step
    currencies:
      type: sequence
      label: 'Currencies domains are priced in; none for every enabled currency'
      sequence:
        type: string
        label: 'Currency code'
    price_list:
      type: string
      label: 'UUID of the price list that gets the price in each currency'
      nullable: true
    field_prefix:
      type: string
      label: 'Prefix of the price fields that get the price in each currency'

commerce_domains_pricing.rule:
  type: mapping
  label: 'Pricing rule'
  mapping:
    extensions:
      type: sequence
      label: 'Extensions; none for any'
      sequence:
        type: string
        label: 'Extension: a public suffix such as co.uk, IDNs as A-labels'
    min_length:
      type: integer
      label: 'Shortest label, in characters'
      nullable: true
    max_length:
      type: integer
      label: 'Longest label, in characters'
      nullable: true
    min_words:
      type: integer
      label: 'Fewest words'
      nullable: true
    max_words:
      type: integer
      label: 'Most words'
      nullable: true
    atom_premium:
      type: boolean
      label: 'Atom premium names only (true), others only (false), or either (null)'
      nullable: true
    price:
      type: mapping
      label: 'Price'
      mapping:
        number:
          type: string
          label: 'Amount'
        currency_code:
          type: string
          label: 'Currency code'

commerce_domains_pricing.rounding_step:
  type: mapping
  label: 'Rounding step'
  mapping:
    up_to:
      type: float
      label: 'Highest amount the step applies to; null for no limit'
      nullable: true
    method:
      type: string
      label: 'Round up, down or to the nearest multiple'
      constraints:
        Choice:
          choices:
            - up
            - down
            - nearest
    multiple:
      type: float
      label: 'Round to a multiple of'
    subtract:
      type: float
      label: 'Then subtract'
    max:
      type: float
      label: 'Highest result; null for no limit'
      nullable: true
