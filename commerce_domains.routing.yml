entity.commerce_domains_provider.registrations:
  path: '/admin/commerce/domains/settings/providers/{commerce_domains_provider}/registrations'
  defaults:
    _form: '\Drupal\commerce_domains\Form\RegistrationsForm'
    _title_callback: '\Drupal\commerce_domains\Form\RegistrationsForm::title'
  requirements:
    _permission: 'administer commerce_domains providers'
    _custom_access: '\Drupal\commerce_domains\Form\RegistrationsForm::access'
  options:
    _admin_route: TRUE
    parameters:
      commerce_domains_provider:
        type: entity:commerce_domains_provider

commerce_domains.product_registrar:
  path: '/product/{commerce_product}/registrar'
  defaults:
    _form: '\Drupal\commerce_domains\Form\DomainRegistrarForm'
    _title: 'Registrar'
  requirements:
    _permission: 'manage domains at registrars'
    _custom_access: '\Drupal\commerce_domains\Form\DomainRegistrarForm::access'
    commerce_product: \d+
  options:
    _admin_route: TRUE
    parameters:
      commerce_product:
        type: entity:commerce_product

# Point the registrar's forwarding of parked domains here.
commerce_domains.lander:
  path: '/domain-lander'
  defaults:
    _controller: '\Drupal\commerce_domains\Controller\LanderController::redirect'
    fallback: '/'
  methods: [GET]
  requirements:
    # Visitors of parked domains, who only get a redirect.
    _access: 'TRUE'
  options:
    no_cache: TRUE

# Groups the settings of the module and its submodules under Commerce →
# Configuration, whose page only lists links that have links of their own.
commerce_domains.configuration:
  path: '/admin/commerce/domains/settings'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'Domains'
  requirements:
    _permission: 'access commerce administration pages'

# One per domain tab beside Edit; see ProductTabs.
route_callbacks:
  - '\Drupal\commerce_domains\Routing\ProductTabRoutes::routes'
