services:
  _defaults:
    autowire: true

  logger.channel.commerce_domains:
    parent: logger.channel_base
    arguments: ['commerce_domains']

  plugin.manager.commerce_domains_provider:
    class: Drupal\commerce_domains\ProviderPluginManager
    parent: default_plugin_manager

  Drupal\commerce_domains\DomainNameParser:
    arguments:
      $cache: '@cache.default'
      $moduleList: '@extension.list.module'
      $logger: '@logger.channel.commerce_domains'

  Drupal\commerce_domains\Availability: ~

  Drupal\commerce_domains\PriceResolver:
    arguments:
      # Commerce Exchanger is optional.
      $exchanger: '@?commerce_exchanger.calculate'

  Drupal\commerce_domains\Catalog: ~

  Drupal\commerce_domains\RegistrarSync:
    arguments:
      $logger: '@logger.channel.commerce_domains'

  Drupal\commerce_domains\EventSubscriber\ProductSubscriber:
    tags:
      - { name: event_subscriber }

  Drupal\commerce_domains\Hook\TokenHooks:
    arguments:
      $currentCurrency: '@commerce_price.current_currency'
      $currentStore: '@commerce_store.current_store'
      $chainPriceResolver: '@commerce_price.chain_price_resolver'

  Drupal\commerce_domains\EventSubscriber\OrderSubscriber:
    tags:
      - { name: event_subscriber }
